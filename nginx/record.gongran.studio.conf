# Reverse proxy for record.gongran.studio -> the Docker container (127.0.0.1:3002).
#
# Install:
#   sudo cp nginx/record.gongran.studio.conf /etc/nginx/sites-available/record.gongran.studio
#   sudo ln -s /etc/nginx/sites-available/record.gongran.studio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add HTTPS (certbot rewrites this file to add the 443 server block + redirect):
#   sudo certbot --nginx -d record.gongran.studio

server {
    listen 80;
    listen [::]:80;
    server_name record.gongran.studio;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NextAuth needs this to know the request was originally HTTPS
        # (matters for secure cookies and building the OAuth callback URL)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
